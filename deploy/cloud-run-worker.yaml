apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: harbouros-worker
  labels:
    cloud.google.com/location: asia-south1
    app: harbouros
    component: worker
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "5"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cpu-throttling: "false"
    spec:
      containerConcurrency: 1
      containers:
        - image: asia-south1-docker.pkg.dev/harbouros-prod/harbouros/worker:v1.0.0-pilot
          command: ["node", "--loader", "tsx", "src/server/entry/worker.ts"]
          resources:
            limits:
              cpu: "1000m"
              memory: "1Gi"
          env:
            - name: NODE_ENV
              value: "production"
            - name: SMS_PROVIDER
              value: "msg91"
            - name: DATABASE_PLATFORM_URL
              valueFrom:
                secretKeyRef:
                  name: harbouros-secrets
                  key: database_platform_url
            - name: MSG91_AUTH_KEY
              valueFrom:
                secretKeyRef:
                  name: harbouros-secrets
                  key: msg91_auth_key
            - name: MSG91_SENDER_ID
              value: "HARBOS"

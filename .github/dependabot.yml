version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Major bumps are handled manually (keep runtime aligned with Node 22 LTS).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    ignore:
      # Stay on the Node 22 LTS line; major bumps are done manually.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # Major action bumps are reviewed and re-pinned manually.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

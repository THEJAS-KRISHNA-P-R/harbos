name: Nightly OWASP ZAP Baseline Security Scan

on:
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  zap-baseline-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: harbouros_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      OWNER_URL: postgresql://postgres:postgrespassword@127.0.0.1:5432/harbouros_test
      APP_URL: postgresql://harbour_app:zap_app_password_harbour_2026@127.0.0.1:5432/harbouros_test
      PLATFORM_URL: postgresql://harbour_platform:zap_platform_password_harbour_2026@127.0.0.1:5432/harbouros_test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migrate database (owner role)
        env:
          DATABASE_PLATFORM_URL: ${{ env.OWNER_URL }}
          HARBOUR_APP_PASSWORD: zap_app_password_harbour_2026
          HARBOUR_PLATFORM_PASSWORD: zap_platform_password_harbour_2026
        run: npm run migrate

      - name: Build frontend
        run: npm run build

      - name: Start HarbourOS in Production Mode (port 8080)
        env:
          NODE_ENV: production
          PORT: '8080'
          DATABASE_URL: ${{ env.APP_URL }}
          DATABASE_PLATFORM_URL: ${{ env.PLATFORM_URL }}
          DEMO_MODE: 'false'
          OTP_DEV_ECHO: 'false'
          RUN_MIGRATIONS_ON_BOOT: 'false'
          SMS_PROVIDER: msg91
          MSG91_SENDER_ID: HARBOS
          MSG91_AUTH_KEY: ci_mock_auth_key_1234567890
          MSG91_OTP_TEMPLATE_ID: ci_otp_template_id_1234
        run: |
          export JWT_ACCESS_SECRET="$(openssl rand -hex 32)"
          export QR_HMAC_SECRET="$(openssl rand -hex 32)"
          nohup node --import tsx src/server/entry/web.ts > /tmp/harbouros.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/readyz >/dev/null && exit 0
            sleep 1
          done
          echo "ERROR: HarbourOS did not become ready within 30s. Server log:"
          cat /tmp/harbouros.log
          exit 1

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          target: 'http://127.0.0.1:8080'
          cmd_options: '-a -m 10'

      - name: Dump server log on failure
        if: failure()
        run: cat /tmp/harbouros.log || true

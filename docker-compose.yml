services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: harbour_owner
      POSTGRES_PASSWORD: harbour_dev_password
      POSTGRES_DB: harbouros
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harbour_owner -d harbouros"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  harbouros-app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://harbour_owner:harbour_dev_password@postgres:5432/harbouros
      JWT_ACCESS_SECRET: dev-compose-access-secret-32bytes-minimum-key-9901
      JWT_REFRESH_SECRET: dev-compose-refresh-secret-32bytes-minimum-key-9902
      QR_HMAC_SECRET: dev-compose-qr-hmac-secret-32bytes-minimum-key-9903
      OTP_DEV_ECHO: "true"
      DEMO_MODE: "true"
      SMS_PROVIDER: "console"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

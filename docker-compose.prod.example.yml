services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-harbouros}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  harbouros-app:
    build: .
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      TRUST_PROXY: "1"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      DATABASE_PLATFORM_URL: ${DATABASE_PLATFORM_URL:?DATABASE_PLATFORM_URL required}
      RLS_PLATFORM_MODE: ${RLS_PLATFORM_MODE:-bypassrls}
      RUN_MIGRATIONS_ON_BOOT: "false"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET required}
      QR_HMAC_SECRET: ${QR_HMAC_SECRET:?QR_HMAC_SECRET required}
      OTP_DEV_ECHO: "false"
      DEMO_MODE: "false"
      SMS_PROVIDER: ${SMS_PROVIDER:-msg91}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:?MSG91_AUTH_KEY required}
      MSG91_SENDER_ID: ${MSG91_SENDER_ID:-HARBOS}
      MSG91_OTP_TEMPLATE_ID: ${MSG91_OTP_TEMPLATE_ID:?MSG91_OTP_TEMPLATE_ID required}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-noop}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  harbouros-worker:
    build: .
    command: ["node", "--import", "tsx", "src/server/entry/worker.ts"]
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      DATABASE_PLATFORM_URL: ${DATABASE_PLATFORM_URL:?DATABASE_PLATFORM_URL required}
      RLS_PLATFORM_MODE: ${RLS_PLATFORM_MODE:-bypassrls}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET required}
      QR_HMAC_SECRET: ${QR_HMAC_SECRET:?QR_HMAC_SECRET required}
      OTP_DEV_ECHO: "false"
      DEMO_MODE: "false"
      SMS_PROVIDER: ${SMS_PROVIDER:-msg91}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:?MSG91_AUTH_KEY required}
      MSG91_SENDER_ID: ${MSG91_SENDER_ID:-HARBOS}
      MSG91_OTP_TEMPLATE_ID: ${MSG91_OTP_TEMPLATE_ID:?MSG91_OTP_TEMPLATE_ID required}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-noop}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

volumes:
  pgdata:

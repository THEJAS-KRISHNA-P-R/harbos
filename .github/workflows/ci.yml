name: HarbourOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & Architectural Boundaries
        run: |
          npm run lint
          npm run check:boundaries
          npm run check:contrast

      - name: Run Unit, Database & Security Exploit Regression Suite
        run: npm test

      - name: Production Frontend Build
        run: npm run build

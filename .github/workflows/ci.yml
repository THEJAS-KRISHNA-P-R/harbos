name: HarbourOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: harbouros_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production Dependency Vulnerability Audit
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck, Boundaries & WCAG Contrast
        run: |
          npm run lint
          npm run check:boundaries
          npm run check:contrast

      - name: Run Migrations Against PostgreSQL 16 Service Container
        env:
          DATABASE_PLATFORM_URL: postgresql://postgres:postgrespassword@localhost:5432/harbouros_test
        run: npm run migrate

      - name: Run Unit, Database (RLS Strict) & Security Regression Suite
        run: npm test

      - name: Production Frontend Build & Asset Budget Gate
        run: |
          npm run build
          npm run check:budget

      - name: Verify Zero Hardcoded Demo Phones in Production Bundle
        run: |
          if grep -rn "+91944700" src/web dist; then
            echo "ERROR: Hardcoded demo phone numbers found in src/web or dist"
            exit 1
          fi

      - name: Verify Multi-Stage Production Docker Build
        run: docker build -t harbouros:ci .
